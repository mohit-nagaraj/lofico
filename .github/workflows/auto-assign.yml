name: Auto-Assign on First Comment

on:
  issue_comment:
    types: [created]

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Check if it's the first comment
        id: check_first_comment
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (comments.data.length === 1) {
              return { assignUser: context.payload.comment.user.login };
            }

            return { assignUser: null };

          result-encoding: json

      - name: Assign the user
        if: steps.check_first_comment.outputs.assignUser != null
        uses: actions/github-script@v6
        with:
          script: |
            const userToAssign = steps.check_first_comment.outputs.assignUser;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [userToAssign],
            });
